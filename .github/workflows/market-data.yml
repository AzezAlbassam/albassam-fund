name: market data
# Daily closes for the race chart and sparklines, saved next to the
# site so the browser never needs a CORS proxy for history.
on:
  schedule:
    - cron: "5 17 * * 1-5"    # midday New York
    - cron: "20 21 * * 1-5"   # after the close
  workflow_dispatch:
permissions:
  contents: write
concurrency: market-data
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/market_data.py data/market.json
      - run: |
          git config user.name "market-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || (git commit -m "market data" && git push)
